        "401":
          description: AUTH_PASSKEY_INVALID (assertion not from one of the user's passkeys, or for another challenge), AUTH_CODE_INVALID, AUTH_PASSWORD_INVALID, AUTH_CODE_EXPIRED (start again)
        "404":
          description: ACCOUNT_DELETION_NOT_FOUND (also when the request's method has since been disabled, or the request was superseded)
