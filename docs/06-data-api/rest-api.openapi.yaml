      properties: {}
    UpdateStoreHoursDto:
      type: object
      required: [weekly, closures, lastOrderMinutes]
      properties:
        weekly:
          type: array
          maxItems: 7
          items:
            type: object
            required: [weekday, opensAt, closesAt]
            properties:
              weekday: { type: integer, minimum: 1, maximum: 7, description: '1 = Monday … 7 = Sunday' }
              opensAt: { type: string, example: '07:00' }
              closesAt: { type: string, example: '22:00', description: '24:00 or 00:00 = midnight; earlier than opensAt = overnight shift ending next morning (DEC-PROD-029); equal to opensAt is rejected' }
        closures:
          type: array
          maxItems: 60
          items:
            type: object
            required: [date]
            properties:
              date: { type: string, format: date }
              note: { type: string, maxLength: 120, nullable: true }
        lastOrderMinutes:
          type: integer
          enum: [0, 15, 30, 45, 60]
    UpdateStoreServiceModeDto:
      type: object
      required:
      - mode
      properties:
        mode:
          type: string
          enum: [OPEN, BUSY, PAUSED]
        resumeAfterMinutes:
          type: integer
          nullable: true
          enum: [30, 60, 120, null]
          description: Auto-resume to OPEN; omit or null = manual. Ignored for OPEN.
        busyExtraMinutes:
          type: integer
          enum: [10, 15, 20, 30, 45, 60]
          description: DEC-PROD-028 — extra prep minutes while BUSY; omit to keep the saved value.
    UpdateStoreAcceptSettingsDto:
      type: object
      required: [acceptMode, maxActiveOrders, defaultPrepMinutes, lastOrderMinutes]
      properties:
        acceptMode: { type: string, enum: [MANUAL, AUTO] }
        maxActiveOrders: { type: integer, minimum: 1, maximum: 50, nullable: true, description: 'null = no cap' }
        defaultPrepMinutes: { type: integer, minimum: 5, maximum: 90 }
        lastOrderMinutes: { type: integer, enum: [0, 15, 30, 45, 60] }
