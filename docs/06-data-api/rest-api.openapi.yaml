          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceFoodItemOptionsDto'
      responses:
        '200':
          description: Item with its saved `optionGroups[{id,name,minSelect,maxSelect,options[{id,name,priceDeltaVnd,available}]}]`
        '400':
          description: FOOD_OPTIONS_INVALID (bounds, duplicate names, unsatisfiable required group)
        '403':
          description: Other merchant / not owner
      security:
      - bearer: []
      summary: Replace the option groups (size / variant / topping) of an owned item (DEC-PROD-033)
      description: Full replace in display order. Send back `id` for groups/options to keep
        (ids not on this item are ignored and minted fresh); omitted ones are deleted. Limits
        10 groups, 20 options per group, names ≤ 80 chars, priceDeltaVnd 0..1,000,000,
        0 ≤ minSelect ≤ maxSelect ≤ option count, and a required group needs enough available
        options. Placed orders keep their snapshot. Customer store detail returns the same
        `optionGroups` on each item.
      tags:
      - food
