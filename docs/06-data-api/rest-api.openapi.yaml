            `{ distanceKm, referenceFareVnd, minFareVnd, maxFareVnd, options[] }` — same reference rule as create:
            per vehicle class, base + km × per-km + minutes × per-minute, rounded up to 1.000đ and kept inside the
            class bounds; `minBidVnd` = RIDE_FARE_FLOOR_PERCENT_OF_REFERENCE % of it, rounded up to 1.000đ. Bids,
            raises and driver counters are rounded up to 1.000đ before they are checked and stored (DEC-PROD-016,
            DEC-PROD-059).
            Each option also carries `tariff` = { regionCode, source: DEFAULT|ZONE, zoneTariffId, version, perKmVnd,
            minFareVnd, bidFloorPercent, bidCeilingPercent }: the zone is resolved on the server from the pickup point
            and the per-zone override (if any) replaces per-km and min fare. This is a REST snapshot; there is no
            tariff socket event and the app never recomputes it. On create the same tariff and the ±band are
            snapshotted onto the ride (ride_pricing_snapshots), so later setting/tariff edits do not affect an open
            negotiation (DEC-PROD-069).
