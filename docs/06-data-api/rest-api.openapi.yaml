        '200':
          description: 'Up to 20 running ACTIVE campaigns for audience ALL/CUSTOMER with budget/usage left and per-user uses
            left, ordered by end date: [{ code, name, description, serviceType, discountType, discountValue, maxDiscountVnd,
            minOrderVnd, endsAt, usesLeft }]. No budget/sponsor fields.'
      security:
      - bearer: []
      summary: Vouchers the customer can still use (customer session)
      tags:
      - promotions
  /v1/public/help/faqs:
    get:
      operationId: listHelpFaqs
      parameters:
      - name: audience
        required: false
        in: query
        schema:
          type: string
          enum: [CUSTOMER, DRIVER, MERCHANT]
          default: CUSTOMER
      responses:
        '200':
          description: 'PUBLISHED FAQ entries for that audience, by sortOrder: [{ id, question, answer, updatedAt }]. INTERNAL
            entries are never returned (400 for audience=INTERNAL).'
      summary: Public in-app help FAQ (managed in Admin › FAQ with an audience)
      tags:
      - support
  /v1/rides/{id}/share-link:
    post:
      operationId: createRideShareLink
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: '{ url, token, expiresAt }. url = PUBLIC_WEB_BASE_URL + /chia-se-chuyen/{token}; only the SHA-256 of
            the token is stored; expires after 12 h.'
        '404':
          description: RIDE_NOT_FOUND (not the caller's ride).
        '409':
          description: RIDE_SHARE_NOT_ACTIVE (ride is not ASSIGNED/DRIVER_EN_ROUTE/DRIVER_ARRIVED/IN_TRIP with a driver).
        '429':
          description: RIDE_SHARE_LIMIT (5 active links per ride).
      security:
      - bearer: []
      summary: Customer creates a read-only trip link for family/friends
      tags:
      - rides
  /v1/public/ride-shares/{token}:
    get:
      operationId: getRideShare
      parameters:
      - name: token
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: '{ status, pickupLabel, dropoffLabel, driver: { name (masked), vehiclePlate, vehicleType, ratingAverage
            } | null, updatedAt, expiresAt }. No customer data, no live coordinates.'
        '404':
          description: RIDE_SHARE_NOT_FOUND.
        '410':
          description: RIDE_SHARE_EXPIRED (past expiresAt, or more than 30 min after the ride finished).
        '429':
          description: More than 30 views of this link per minute. Throttled per token, not per IP, because
            the website server renders the page for every viewer; the page polls every 15 s and stops once
            the trip ends.
      summary: Public trip snapshot behind a share link
      tags:
      - rides
  /v1/ops/auth-methods:
    get:
      operationId: list
      parameters: []
      responses:
        '200':
          description: ''
      security:
      - bearer: []
      summary: List global auth method flags (PASSKEY, PHONE_SMS, EMAIL_LOGIN_IDENTIFIER). Defaults ENABLED.
      tags:
      - ops
  /v1/ops/auth-methods/{method}:
    patch:
      operationId: patch
      parameters:
      - name: method
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchAuthMethodDto'
      responses:
        '200':
          description: ''
      security:
      - bearer: []
      summary: Enable/disable a global auth method with reason; refuses disabling the last enabled method. Writes
        OpsAuditLog.
      tags:
      - ops
  /v1/ops/exceptions:
    get:
      operationId: list
      parameters: []
      responses:
        '200':
          description: Paginated exception items
        '401':
          description: Missing/invalid ops session
        '403':
          description: Not ops channel
      security:
      - bearer: []
      summary: 'Ops exception queue: stuck mid-lifecycle rides/food and recent FAILED/CANCELLED/EXPIRED'
      tags:
      - ops
  /v1/ops/overview:
    get:
      operationId: getOverview
      parameters: []
      responses:
        '200':
          description: ''
      security:
      - bearer: []
      summary: Ops dashboard KPIs + optional panels (hourlyTrend, recentActivity, ridesByArea, foodByCategory).
        Today = Asia/Ho_Chi_Minh. revenueVnd/commissionVnd null. Enrichment fail-soft → empty arrays.
      tags:
      - ops
  /v1/ops/monitor/snapshot:
    get:
      operationId: getMonitorSnapshot
      parameters: []
      responses:
        '200':
          description: ''
      security:
      - bearer: []
      summary: 'Live board: core KPIs + mapMarkers, queue, areaDemand, recentActivity, systemAlerts, optional pilotZoneLabel.
        Enrichment fail-soft.'
      tags:
      - ops
  /v1/ops/audit-logs:
    get:
      operationId: list
      parameters:
      - name: q
        required: false
        in: query
        description: Filter by action name or search query
        schema:
          type: string
      - name: entityType
        required: false
        in: query
        description: Filter by entity type (RIDE, FOOD_ORDER, SETTINGS, DISPUTE, FAQ)
        schema:
          type: string
      - name: result
        required: false
        in: query
        description: Filter by result tone / status (SUCCESS, PENDING_APPROVAL, LOGGED, REJECTED)
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Page number (1-based)
        schema:
          default: 1
          type: number
      - name: limit
        required: false
        in: query
        description: Page limit (1-100)
        schema:
          default: 20
          type: number
      responses:
        '200':
          description: ''
      security:
      - bearer: []
      summary: List immutable ops audit log events (CAP-OPS-05, settings, faqs, disputes, auth updates).
      tags:
      - ops
  /v1/support/tickets:
    get:
      operationId: listMySupportTickets
      parameters:
      - name: state
        in: query
        required: false
        schema:
          type: string
          enum: [ACTIVE, DONE]
        description: ACTIVE = OPEN|IN_PROGRESS, DONE = RESOLVED|CLOSED. Omit for all.
      - name: page
        in: query
        required: false
        schema: {type: integer, minimum: 1, default: 1}
      - name: limit
        in: query
        required: false
        schema: {type: integer, minimum: 1, maximum: 50, default: 20}
      responses:
        '200':
          description: '{ items: SupportTicket[] (no messages), total, page, limit, activeCount, doneCount },
            newest lastMessageAt first. Only tickets the caller created.'
      security:
      - bearer: []
      summary: My support requests (app session, any active role)
      tags:
      - support
    post:
      operationId: createSupportTicket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, subject, description]
              properties:
                category: {type: string, enum: [RIDE, FOOD, PAYMENT, ACCOUNT, SAFETY, OTHER]}
                subject: {type: string, minLength: 3, maxLength: 120}
                description: {type: string, minLength: 10, description: 'Max SUPPORT_TICKET_TEXT_MAX_CHARS (default 2000).'}
                role: {type: string, enum: [CUSTOMER, DRIVER, MERCHANT], default: CUSTOMER}
                relatedType: {type: string, enum: [RIDE, FOOD_ORDER]}
                relatedId: {type: string, format: uuid}
      responses:
        '201':
          description: SupportTicket with messages. The description is stored as the first REQUESTER message.
            SAFETY starts at priority HIGH, everything else NORMAL. Code format DG-YYMMDD-NNNN (Asia/Ho_Chi_Minh day).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTicket'
        '400':
          description: Validation, SUPPORT_TEXT_TOO_LONG.
        '404':
          description: SUPPORT_RELATED_NOT_FOUND (related ride/order missing or caller not a participant).
        '409':
          description: SUPPORT_TICKET_LIMIT_REACHED (SUPPORT_TICKET_MAX_OPEN_PER_USER active tickets, default 5;
            enforced under a user row lock).
      security:
      - bearer: []
      summary: Create a support request (app session)
      tags:
      - support
  /v1/support/tickets/{id}:
    get:
      operationId: getMySupportTicket
      parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: SupportTicket with messages. Staff identities are never exposed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTicket'
        '404':
          description: SUPPORT_TICKET_NOT_FOUND (also for other users' tickets).
      security:
      - bearer: []
      summary: One of my support requests with its thread (app session)
      tags:
      - support
  /v1/support/tickets/{id}/messages:
    post:
      operationId: addSupportTicketMessage
      parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: {type: string, minLength: 1}
                attachments:
                  type: array
                  maxItems: 3
                  items:
                    type: object
                    required: [contentType, contentBase64]
                    properties:
                      label: {type: string, maxLength: 80}
                      contentType: {type: string, description: 'Must be in UPLOAD_ALLOWED_TYPES; bytes signature-checked'}
                      contentBase64: {type: string, description: 'Max UPLOAD_MAX_FILE_KB'}
      responses:
        '201':
          description: Updated SupportTicket (messages[].attachments[{index,label,contentType,sizeBytes}]). A RESOLVED ticket reopens to IN_PROGRESS.
        '404':
          description: SUPPORT_TICKET_NOT_FOUND.
        '409':
          description: SUPPORT_TICKET_CLOSED.
      security:
      - bearer: []
      summary: Add a message to my support request (app session)
      tags:
      - support
  /v1/support/tickets/{id}/messages/{messageId}/attachments/{index}:
    get:
      operationId: getSupportTicketAttachment
      parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: messageId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: index, in: path, required: true, schema: {type: integer, minimum: 0}}
      responses:
        '200':
          description: Attachment bytes (owner only; ops use /v1/ops/support-tickets/{id}/messages/{messageId}/attachments/{index}).
        '404':
          description: SUPPORT_ATTACHMENT_NOT_FOUND.
      security:
      - bearer: []
      summary: Download an attachment of my support request
      tags:
      - support
  /v1/public/support/tickets:
    post:
      operationId: createPublicSupportTicket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, category, description, contact]
              properties:
                role: {type: string, enum: [CUSTOMER, DRIVER, MERCHANT, OTHER]}
                category: {type: string, enum: [RIDE, FOOD, PAYMENT, ACCOUNT, SAFETY, OTHER]}
                description: {type: string, minLength: 10}
                contact: {type: string, description: 'Email or Vietnamese phone; normalized (lowercase email, 0XXXXXXXXX).'}
                contactName: {type: string, maxLength: 80}
                externalRef: {type: string, maxLength: 50, description: Order/ride reference typed by the visitor.}
      responses:
        '201':
          description: '{ code, createdAt } only. Web requesters cannot read the thread; staff contact them directly.'
        '400':
          description: Validation, SUPPORT_CONTACT_INVALID, SUPPORT_TEXT_TOO_LONG.
        '429':
          description: SUPPORT_CONTACT_LIMIT_REACHED (SUPPORT_PUBLIC_TICKETS_PER_CONTACT_PER_DAY, default 3)
            or global throttle.
      security: []
      summary: Website support form (no session, throttled)
      tags:
      - support
  /v1/ops/support-tickets:
    get:
      operationId: listOpsSupportTickets
      parameters:
      - {name: status, in: query, required: false, schema: {type: string, enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED]}}
      - {name: category, in: query, required: false, schema: {type: string, enum: [RIDE, FOOD, PAYMENT, ACCOUNT, SAFETY, OTHER]}}
      - {name: channel, in: query, required: false, schema: {type: string, enum: [APP, WEB]}}
      - {name: q, in: query, required: false, schema: {type: string, maxLength: 100}, description: Code, subject, contact or requester phone/email.}
      - {name: page, in: query, required: false, schema: {type: integer, minimum: 1, default: 1}}
      - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
      responses:
        '200':
          description: '{ items, total, page, limit } newest lastMessageAt first; items include requester { userId,
            displayName, phone, email } or web contact.'
      security:
      - bearer: []
      summary: Support ticket queue (ops session)
      tags:
      - ops
  /v1/ops/support-tickets/{id}:
    get:
      operationId: getOpsSupportTicket
      parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Ticket with full thread including staff authorUserId.
        '404':
          description: SUPPORT_TICKET_NOT_FOUND.
      security:
      - bearer: []
      summary: Support ticket detail (ops session)
      tags:
      - ops
    patch:
      operationId: patchOpsSupportTicket
      parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                status: {type: string, enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED]}
                priority: {type: string, enum: [LOW, NORMAL, HIGH, URGENT]}
                reason: {type: string, minLength: 3, maxLength: 500}
      responses:
        '200':
          description: Updated ticket. Writes OpsAuditLog SUPPORT_TICKET_UPDATE. RESOLVED sends an in-app inbox
            notice to APP requesters.
        '400':
          description: SUPPORT_PATCH_EMPTY, validation.
        '404':
          description: SUPPORT_TICKET_NOT_FOUND.
      security:
      - bearer: []
      summary: Change support ticket status/priority with a reason (ops session)
      tags:
      - ops
  /v1/ops/support-tickets/{id}/replies:
    post:
      operationId: replyOpsSupportTicket
      parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: {type: string, minLength: 1}
      responses:
        '201':
          description: Updated ticket. OPEN moves to IN_PROGRESS. APP requesters get an inbox notice
            (aggregateType SupportTicket, sourceEventKey support-reply:<messageId>). Audited.
        '409':
          description: SUPPORT_TICKET_CLOSED.
      security:
      - bearer: []
      summary: Staff reply to a support ticket (ops session)
      tags:
      - ops
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    SupportTicket:
      type: object
      properties:
        id: {type: string, format: uuid}
        code: {type: string, example: DG-261019-0042}
        channel: {type: string, enum: [APP, WEB]}
        category: {type: string, enum: [RIDE, FOOD, PAYMENT, ACCOUNT, SAFETY, OTHER]}
        subject: {type: string}
        status: {type: string, enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED]}
        priority: {type: string, enum: [LOW, NORMAL, HIGH, URGENT]}
        relatedType: {type: string, enum: [RIDE, FOOD_ORDER], nullable: true}
        relatedId: {type: string, format: uuid, nullable: true}
        lastMessagePreview: {type: string, description: 'List items only: last message, trimmed.'}
        awaitingRequester: {type: boolean, description: Latest message is from staff.}
        lastMessageAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        resolvedAt: {type: string, format: date-time, nullable: true}
        closedAt: {type: string, format: date-time, nullable: true}
        messages:
          type: array
          items:
            type: object
            properties:
              id: {type: string, format: uuid}
              author: {type: string, enum: [REQUESTER, STAFF]}
              body: {type: string}
              createdAt: {type: string, format: date-time}
    DriverHistoryItem:
      type: object
      properties:
        kind:
          type: string
          enum: [RIDE, FOOD_ORDER]
        id:
          type: string
          format: uuid
        status:
          type: string
        outcome:
          type: string
          enum: [COMPLETED, CANCELLED, FAILED]
        fareVnd:
          type: integer
        feePercent:
          type: number
          nullable: true
          description: Platform fee rate snapshotted at completion (PLATFORM_FEE_RIDE_PERCENT /
            PLATFORM_FEE_FOOD_PERCENT); null when not completed.
        feeVnd:
          type: integer
          description: Platform fee withheld (snapshot); 0 when not completed.
        earningsVnd:
          type: integer
          description: Net earnings = fareVnd - feeVnd when COMPLETED, else 0.
        pickupLabel:
          type: string
          nullable: true
        dropoffLabel:
          type: string
        storeName:
          type: string
          nullable: true
        finishedAt:
          type: string
          format: date-time
        driverStars:
          type: integer
          nullable: true
    SubmitRatingDto:
      type: object
      required: [subjectType, subjectId]
      properties:
        subjectType: { type: string, enum: [RIDE, FOOD_ORDER] }
        subjectId: { type: string, format: uuid }
        driverStars: { type: integer, minimum: 1, maximum: 5, description: Required when a driver handled it. }
        storeStars: { type: integer, minimum: 1, maximum: 5, description: Food orders only (required there). }
        tags:
          type: array
          maxItems: 6
          items:
            type: string
            enum: [ON_TIME, FRIENDLY, SAFE_DRIVING, CLEAN_VEHICLE, TASTY_FOOD, WELL_PACKED, LATE, RUDE, UNSAFE_DRIVING, WRONG_ITEMS, COLD_FOOD]
        comment: { type: string, maxLength: 500 }
    SavedAddress:
      type: object
      required: [id, kind, label, addressLine, isDefault, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [HOME, WORK, OTHER] }
        label: { type: string, maxLength: 60 }
        addressLine: { type: string, maxLength: 300 }
        note: { type: string, nullable: true, maxLength: 200 }
        lat: { type: number, nullable: true }
        lng: { type: number, nullable: true }
        isDefault: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateSavedAddressDto:
      type: object
      required: [kind, label, addressLine]
      properties:
        kind: { type: string, enum: [HOME, WORK, OTHER] }
        label: { type: string, minLength: 1, maxLength: 60 }
        addressLine: { type: string, minLength: 3, maxLength: 300 }
        note: { type: string, maxLength: 200 }
        lat: { type: number, minimum: -90, maximum: 90, description: Send with lng. }
        lng: { type: number, minimum: -180, maximum: 180, description: Send with lat. }
        isDefault: { type: boolean }
    UpdateSavedAddressDto:
      type: object
      properties:
        kind: { type: string, enum: [HOME, WORK, OTHER] }
        label: { type: string, minLength: 1, maxLength: 60 }
        addressLine: { type: string, minLength: 3, maxLength: 300 }
        note: { type: string, maxLength: 200 }
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        isDefault: { type: boolean, description: Only true is meaningful. }
    PhoneChallengeDto:
      type: object
      properties: {}
    VerifyCodeDto:
      type: object
      properties: {}
    EmailPasswordRegisterDto:
      type: object
      properties: {}
    EmailPasswordLoginDto:
      type: object
      properties: {}
    EmailVerificationDto:
      type: object
      properties: {}
    ConfirmEmailDto:
      type: object
      properties: {}
    PasswordResetRequestDto:
      type: object
      properties: {}
    PasswordResetConfirmDto:
      type: object
      properties: {}
    RegistrationVerifyDto:
      type: object
      properties: {}
    PasskeySignupVerifyDto:
      allOf:
      - $ref: '#/components/schemas/RegistrationVerifyDto'
      - type: object
        required: [ceremonyId]
        properties:
          ceremonyId:
            type: string
            format: uuid
    AuthenticationVerifyDto:
      type: object
      properties: {}
    RefreshSessionDto:
      type: object
      properties: {}
    OpsLoginDto:
      type: object
      properties: {}
    UpdateMeDto:
      type: object
      properties: {}
    UploadAvatarDto:
      type: object
      properties: {}
    ReportLocationDto:
      type: object
      required: [lat, lng]
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
    DriverLocationResponse:
      type: object
      required: [location]
      properties:
        location:
          nullable: true
          type: object
          required: [lat, lng, at]
          properties:
            lat:
              type: number
            lng:
              type: number
            at:
              type: string
              format: date-time
    UpsertPresenceDto:
      type: object
      required:
      - online
      properties:
        online:
          type: boolean
        rideEnabled:
          type: boolean
          description: DEC-PROD-023 take ride requests while online; omitted keeps the stored value (default true)
        foodEnabled:
          type: boolean
          description: DEC-PROD-023 take food deliveries while online; omitted keeps the stored value (default true)
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
    RequestRoleGrantDto:
      type: object
      properties: {}
    SubmitPartnerApplicationDto:
      type: object
      properties: {}
    RejectPartnerApplicationDto:
      type: object
      properties: {}
    ResolveDisputeDto:
      type: object
      properties:
        remedy:
          type: string
          enum:
          - evidence
          - partial
          - full
          - reject
          description: Remedy action chosen by operator
          example: partial
        reason:
          type: string
          description: Reason and justification for the decision (recorded in audit log)
          example: Khách cung cấp ảnh thiếu 1 phần topping; đối soát xác nhận với quán hoàn một phần 35.000 VNĐ.
          maxLength: 500
        note:
          type: string
          description: Internal operational note or feedback to parties
          example: Đã thông báo quán Highlands để lưu ý đóng gói các đơn sau.
          maxLength: 1000
        amount:
          type: number
          description: Refund amount in VND when partial refund is selected
          example: 35000
      required:
      - remedy
      - reason
    CreateOpsFaqDto:
      type: object
      properties: {}
    PatchOpsFaqDto:
      type: object
      properties: {}
    GeoPointDto:
      type: object
      required: [lat, lng, label]
      properties:
        lat: {type: number, minimum: -90, maximum: 90}
        lng: {type: number, minimum: -180, maximum: 180}
        label: {type: string, minLength: 1, maxLength: 160}
    CreateRideDto:
      type: object
      properties: {}
    CreateOfferDto:
      type: object
      properties: {}
    SelectOfferDto:
      type: object
      required:
      - offerId
      properties:
        offerId:
          type: string
          format: uuid
        voucherCode:
          type: string
          minLength: 1
          maxLength: 40
          pattern: '^[A-Za-z0-9_-]+$'
          description: DEC-PROD-024. Optional RIDE voucher, evaluated on the agreed fare (the
            selected offer) and redeemed in the same transaction as the assignment. Only
            PLATFORM-sponsored, non-DELIVERY_DISCOUNT campaigns apply to rides. The ride snapshots
            discountVnd and voucherCode and the response adds cashDueVnd = agreedFareVnd -
            discountVnd. Released on customer cancel, ops cancel and ops reassign. A replayed
            Idempotency-Key never redeems twice.
    OpsInterveneDto:
      type: object
      properties: {}
    PatchPlatformSettingDto:
      type: object
      properties: {}
    PlaceFoodOrderDto:
      type: object
      required:
      - storeId
      - items
      - dropoff
      properties:
        storeId:
          type: string
          format: uuid
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [itemId, quantity]
            properties:
              itemId:
                type: string
                format: uuid
              quantity:
                type: integer
                minimum: 1
              optionIds:
                type: array
                maxItems: 50
                items:
                  type: string
                  format: uuid
                description: DEC-PROD-033. Chosen option ids of this dish. The server checks each
                  group's minSelect/maxSelect and availability inside the placement transaction
                  (409 FOOD_OPTION_INVALID otherwise), prices the line as base + sum of
                  priceDeltaVnd, and snapshots the choices on the order line as
                  `options[{optionId,groupName,name,priceDeltaVnd}]`. The same dish with different
                  options becomes separate lines.
        dropoff:
          type: object
          required: [lat, lng, label]
          properties:
            lat:
              type: number
            lng:
              type: number
            label:
              type: string
        deliveryFareVnd:
          type: integer
          description: Ignored; the server quotes the delivery fare.
        voucherCode:
          type: string
          maxLength: 40
          pattern: '^[A-Za-z0-9_-]+$'
          description: Optional. Re-validated and redeemed in the same transaction as the order
            (promotion row locked; usageLimit, userLimit and budget enforced). The order snapshots
            discountVnd and voucherCode; totalVnd is net of the discount.
