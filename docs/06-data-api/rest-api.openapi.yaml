      tags: *a120
  /v1/rides/vehicle-classes:
    get:
      operationId: vehicleClasses
      parameters: []
      responses:
        "200":
          description: ""
      security: *a119
      summary: Enabled ride vehicle classes for booking and driver registration
      tags: *a120
  /v1/support/tickets:
    get:
      operationId: list
      parameters: []
      responses:
        "200":
          description: "{ items: SupportTicket[] (no messages), total, page, limit, activeCount, doneCount }, newest lastMessageAt first. Only tickets the caller created."
      security: &a123
        - bearer: []
      summary: My support tickets, latest activity first. ?state=ACTIVE|DONE
      tags: &a124
        - support
    post:
      operationId: create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSupportTicketDto"
      responses:
        "201":
          description: SupportTicket with messages. The description is stored as the first REQUESTER message. SAFETY starts at priority HIGH, everything else NORMAL. Code format DG-YYMMDD-NNNN (Asia/Ho_Chi_Minh day).
        "400":
          description: Validation, SUPPORT_TEXT_TOO_LONG.
        "404":
          description: SUPPORT_RELATED_NOT_FOUND (related ride/order missing or caller not a participant).
        "409":
          description: SUPPORT_TICKET_LIMIT_REACHED (SUPPORT_TICKET_MAX_OPEN_PER_USER active tickets, default 5; enforced under a user row lock).
      security: *a123
      summary: Open a support ticket (optionally about one of my rides/orders). Open tickets per user are capped by SUPPORT_TICKET_MAX_OPEN_PER_USER.
      tags: *a124
  /v1/support/tickets/{id}:
    get:
      operationId: get
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: SupportTicket with messages. Staff identities are never exposed.
        "404":
          description: SUPPORT_TICKET_NOT_FOUND (also for other users' tickets).
      security: *a123
      summary: One of my tickets with its message thread
      tags: *a124
  /v1/support/tickets/{id}/messages:
    post:
      operationId: message
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportMessageDto"
      responses:
        "200":
          description: ""
        "201":
          description: Updated SupportTicket (messages[].attachments[{index,label,contentType,sizeBytes}]). A RESOLVED ticket reopens to IN_PROGRESS.
        "404":
          description: SUPPORT_TICKET_NOT_FOUND.
        "409":
          description: SUPPORT_TICKET_CLOSED.
      security: *a123
      summary: Add a message to my ticket (reopens a RESOLVED ticket; CLOSED → 409)
      tags: *a124
  /v1/support/tickets/{id}/messages/{messageId}/attachments/{index}:
    get:
      operationId: attachment
      parameters: []
      responses:
        "200":
          description: Attachment bytes (owner only; ops use /v1/ops/support-tickets/{id}/messages/{messageId}/attachments/{index}).
        "404":
          description: SUPPORT_ATTACHMENT_NOT_FOUND.
      security: *a123
      summary: Download an attachment from one of my tickets
      tags: *a124
