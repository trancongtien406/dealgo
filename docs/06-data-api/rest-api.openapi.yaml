  /v1/food/merchant/store/hours:
    put:
      operationId: updateStoreHours
      description: >-
        M023 / DEC-PROD-027/029. Replaces the whole schedule (Vietnam local time). Weekdays left out of
        `weekly` are closed; a closure cancels the shift that starts that Vietnam calendar day; lastOrderMinutes stops new
        orders that many minutes before closing. Before the first save a store is open all day.
        Outside the schedule POST /v1/food/orders returns 409 FOOD_STORE_CLOSED. Store list/detail
        expose openNow + closedReason (PAUSED | CLOSED) and GET /v1/food/stores sorts open stores first.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStoreHoursDto'
      responses:
        '200':
          description: Store detail including openNow, closedReason and schedule
        '400':
          description: FOOD_HOURS_INVALID (closes equals opens, duplicate weekday/date, bad date or time) or DTO validation
        '403':
          description: Active MERCHANT role required
      security:
      - bearer: []
      summary: Replace the merchant store weekly hours, closed days and cut-off
      tags:
      - food
  /v1/food/merchant/store/accept-settings:
    put:
      operationId: updateStoreAcceptSettings
      description: >-
        M022 / DEC-PROD-028. AUTO puts new orders straight into PREPARING (same outbox event as a
        manual accept); MANUAL keeps them in PLACED. maxActiveOrders caps PLACED+PREPARING orders and
        is checked inside the placement transaction under a store row lock: over the cap POST
        /v1/food/orders returns 409 FOOD_STORE_AT_CAPACITY. defaultPrepMinutes (+ busyExtraMinutes
        while BUSY) is snapshotted on each order as prepMinutes / estimatedReadyAt and exposed on the
        store detail as estimatedPrepMinutes. lastOrderMinutes is the same cut-off as M023.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStoreAcceptSettingsDto'
      responses:
        '200':
          description: Store detail including acceptSettings and estimatedPrepMinutes
        '400':
          description: DTO validation (unknown mode, cap outside 1–50, prep outside 5–90, cut-off not 0/15/30/45/60)
        '403':
          description: Active MERCHANT role required
      security:
      - bearer: []
      summary: Set M022 order acceptance (manual/auto, active-order cap, prep minutes)
      tags:
      - food
  /v1/food/merchant/store/status:
    patch:
      operationId: updateStoreServiceMode
      description: >-
        M024 / DEC-PROD-026. OPEN and BUSY take orders (BUSY is shown to customers); PAUSED makes
        POST /v1/food/orders return 409 FOOD_STORE_PAUSED. resumeAfterMinutes (30/60/120) sets
        serviceModeUntil; after it the store reads as OPEN everywhere. Accepted orders are unaffected.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStoreServiceModeDto'
      responses:
        '200':
          description: Store detail including serviceMode and serviceModeUntil
        '400':
          description: Unknown mode or resumeAfterMinutes not in 30/60/120
        '403':
          description: Active MERCHANT role required
      security:
      - bearer: []
      summary: Set the merchant store intake mode
      tags:
      - food
