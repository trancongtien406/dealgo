            rideEarningsVnd, foodEarningsVnd }, rating { average, count, distribution[5] } }. Days (today, days[])
            carry { date, completedJobs, grossVnd, feeVnd, earningsVnd }. Days are Asia/Ho_Chi_Minh calendar
            days. earningsVnd = net (gross - platform fee snapshotted per job at completion; DEC-PROD-014).'
        '403':
          description: ROLE_NOT_ACTIVE.
      security:
      - bearer: []
      summary: Driver earnings today and last 7 days plus rating (app session, active driver)
      tags:
