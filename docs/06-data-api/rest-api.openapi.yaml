# Generated from GET /docs-json (Nest Swagger) on 2026-10-18, merged with the previous hand-written
# response codes/descriptions for routes that already existed. Regenerate when routes change.
openapi: 3.0.0
info:
  title: DealGo API
  description: |-
    DealGo REST API for Ride + Food MVP.

    Success responses are wrapped by the Nest response interceptor as:
    `{ success: true, statusCode, message, data, requestId }`.
    Errors use:
    `{ success: false, statusCode, message, errorCode, timestamp, path, requestId }`.

    Money fields are integer VND (no floats). Server is the source of truth for roles,
    assignment, status transitions, and committed fares. Do not trust client role/price.

    Ride cancel is allowed while NEGOTIATING or before IN_TRIP
    (ASSIGNED / DRIVER_EN_ROUTE / DRIVER_ARRIVED). Food cancel is PLACED only.
    COMPLETED / DELIVERED post a sandbox COD ledger journal (balanced, idempotent)
    and optionally a PaymentIntent COD row (status SANDBOX_RECORDED).
    VNPAY/MoMo create redirect intent (PENDING_REDIRECT) only; webhook stubs may mark CAPTURED_STUB
    — not a claim of real settlement.

    MapsPort (ADR-006): MAPS_PROVIDER=mock|goong|google; non-mock without API key is unavailable
    (ride reference fare falls back to haversine). Fee formulas bounded by environment configuration.

    KYC/KYB: POST /v1/me/partner-applications; ops review under /v1/ops/partner-applications.
    REJECTED sets RoleGrant SUSPENDED; APPROVED sets ACTIVE.
    Driver open/ready lists accept optional lat/lng (DRIVER_SEARCH_RADIUS_KM); without coords return a capped list.
    Admin PlatformSettings: GET/PATCH /v1/ops/platform-settings
    — DB overrides env bootstrap for radius, fare bounds, offer TTL, contact window, payment method flags,
    pilot zone label, max concurrent jobs; secrets stay env-only. Ops FAQ CMS: GET/POST/PATCH /v1/ops/faqs
    (OPEN-001..021 DRAFT answers labeled PROPOSED; only PUBLISHED for future public/help).
    DriverPresence (POST/GET /v1/me/presence): when online=false, open/ready return empty.
    FoodStore optional lat/lng (PATCH /v1/food/merchant/store/location); ready radius prefers store coords.
    Customer history: GET /v1/rides and GET /v1/food/orders (page/limit, actor-scoped).
    Ops CAP-OPS-05: POST /v1/ops/rides|food-orders/:id/cancel {reason} writes OpsAuditLog + outbox;
    optional …/reassign allows reassigning (ride→NEGOTIATING pre-trip; food→READY when ASSIGNED).
    Ops directory: GET /v1/ops/customers|drivers|stores (page/limit) and GET …/:id — role-scoped users
    and FoodStore catalog; no password hashes or refresh tokens.

    Realtime: Socket.IO `subscribe` to `ride:{uuid}` / `food:{uuid}` with Bearer handshake;
    outbox relay emits `snapshot` hints and push (mock or FCM HTTP v1 when FCM_* keys set).
    Production refuses PUSH_PROVIDER=mock and VOICE_PROVIDER=mock.
    Optional Redis Socket.IO adapter when REDIS_URL is up (soft fallback to single-process).
    OTP throttling uses Redis storage when REDIS_URL is set; otherwise in-memory.
    Ops sandbox settlements: GET `/v1/ops/settlements` groups COD ledger journals by UTC day (no payout).
    Ops overview: GET `/v1/ops/overview` — core KPIs + panels hourlyTrend (24h Asia/Ho_Chi_Minh),
    recentActivity, ridesByArea, foodByCategory (Ride+Food only; no freight product).
    Live board: GET `/v1/ops/monitor/snapshot` — KPIs + mapMarkers, queue, areaDemand, recentActivity,
    systemAlerts, optional pilotZoneLabel. Enrichment queries fail-soft (empty arrays; core KPIs preserved).
    “today” = Asia/Ho_Chi_Minh calendar day (UTC+7); revenueVnd/commissionVnd are null (no fee invent).
    Ops auth methods (DEC-PROD-006 / FR-OPS-010): GET/PATCH `/v1/ops/auth-methods` — PASSKEY,
    PHONE_SMS, EMAIL_LOGIN_IDENTIFIER (email is contact/login identifier, not email OTP login).
    Defaults ENABLED; refuse disabling the last enabled method; enroll/auth rejects AUTH_METHOD_DISABLED.
    OPEN-020 recovery/per-account controls remain open.
    Email sign-up is two-step: POST /v1/auth/email/register emails a 6-digit code (no account yet;
    same response for existing emails), POST …/register/:id/verify creates the verified account,
    grants CUSTOMER and issues a session; …/register/:id/resend has a cooldown. Wrong codes count
    per challenge (resend does not reset them); a locked challenge cannot be resent.
    Email login with the right password on an unverified email returns 403 AUTH_EMAIL_NOT_VERIFIED
    with details {challengeId, expiresAt, resendAvailableAt} and emails an activation code, verified
    through the same …/register/:id/verify (marks the email verified, ensures CUSTOMER, issues a session).
    Chat + voice (DEC-PROD-007 / 1A): POST/GET messages and POST voice-session on rides/food orders
    (participants; audio-only; bounded by CONTACT_WINDOW_MINUTES).
  version: 0.1.0
  contact: {}
servers:
- url: http://localhost:3001
  description: Local Nest API
tags:
- name: support
  description: Support requests (app tickets, website form)
- name: identity
  description: Auth, sessions, me, role grants
- name: rides
  description: Ride negotiation and trip lifecycle
- name: food
  description: Food catalog and order lifecycle
- name: chat
  description: Transaction-scoped text chat
- name: voice
  description: In-app audio-only voice sessions (LiveKit/mock)
- name: payments
  description: PSP webhook stubs (VNPAY/MoMo)
- name: ops
  description: Operator explorer (ops session)
- name: health
  description: Liveness / readiness
paths:
  /:
    get:
      operationId: getHello
      parameters: []
      responses:
        '200':
          description: OK
      tags:
      - App
  /health:
    get:
      operationId: getHealth
      parameters: []
      responses:
        '200':
          description: ok or degraded
      summary: Combined dependency health (not wrapped in success envelope)
      tags:
      - health
  /health/live:
    get:
      operationId: getLive
      parameters: []
      responses:
        '200':
          description: '{ status: ok }'
      summary: 'Liveness: process is up (no dependency checks)'
      tags:
      - health
  /health/ready:
    get:
      operationId: getReady
      parameters: []
      responses:
        '200':
          description: ok or degraded (DB up)
        '503':
          description: not_ready (DB down)
      summary: 'Readiness: database required (503 when down); Redis optional (degraded when down)'
      tags:
      - health
  /v1/auth/methods:
    get:
      operationId: listMethods
      parameters: []
      responses:
        '200':
          description: ''
      summary: List public enabled authentication methods
      tags:
      - identity
  /v1/auth/phone/challenges:
    post:
      operationId: createPhoneChallenge
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneChallengeDto'
      responses:
        '200':
          description: Challenge created
        '429':
          description: Rate limited
      summary: Start phone OTP challenge (rate limited)
      tags:
      - identity
  /v1/auth/phone/challenges/{id}/verify:
    post:
      operationId: verifyPhoneChallenge
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyCodeDto'
      responses:
        '200':
          description: Session issued
        '429':
          description: Rate limited
      summary: Verify phone OTP and issue customer session (rate limited)
      tags:
      - identity
  /v1/auth/email/register:
    post:
      operationId: registerEmail
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailPasswordRegisterDto'
      responses:
        '200': &id001
          description: 'Pending sign-up challenge (no account yet). `data`: { challengeId, expiresAt, resendAvailableAt
            }'
        '400':
          description: VALIDATION_ERROR
        '403':
          description: AUTH_METHOD_DISABLED
        '429':
          description: AUTH_OTP_RATE_LIMITED (5 challenges per email per hour) or throttled
        '503':
          description: EMAIL_DELIVERY_FAILED
      summary: 'Start email+password sign-up: emails a 6-digit code and returns a pending challenge (no account
        yet; same response for existing emails; rate limited)'
      tags:
      - identity
  /v1/auth/email/register/{id}/verify:
    post:
      operationId: verifyEmailRegistration
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyCodeDto'
      responses:
        '200':
          description: 'Sign-up: account created (email verified, CUSTOMER ACTIVE). Activation: existing account
            marked email-verified, CUSTOMER ensured. `data`: { accessToken, refreshToken, expiresIn, user }'
        '401':
          description: AUTH_CODE_INVALID (also when the account email changed after an activation code) or AUTH_CODE_EXPIRED
        '409':
          description: EMAIL_IN_USE (address claimed after the challenge started)
        '429':
          description: AUTH_CODE_LOCKED after 5 wrong codes in total for the challenge (resends included)
      summary: 'Verify an emailed code: a sign-up challenge creates the verified account; an activation challenge
        (from login) verifies the existing account. Issues a customer session (rate limited)'
      tags:
      - identity
  /v1/auth/email/register/{id}/resend:
    post:
      operationId: resendEmailRegistration
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      responses:
        '200': *id001
        '401':
          description: AUTH_CODE_INVALID (unknown or used challenge)
        '429':
          description: AUTH_OTP_RESEND_COOLDOWN (60 s), AUTH_OTP_RESEND_LIMIT (5 sends) or AUTH_CODE_LOCKED
            (start a new challenge)
      summary: Email a new code for a sign-up or activation challenge (cooldown, send limit, refused once locked;
        rate limited)
      tags:
      - identity
  /v1/auth/email/login:
    post:
      operationId: loginEmail
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailPasswordLoginDto'
      responses:
        '200':
          description: ''
        '401':
          description: AUTH_INVALID_CREDENTIALS
        '403':
          description: 'AUTH_METHOD_DISABLED, or AUTH_EMAIL_NOT_VERIFIED (right password, email never verified):
            an activation code is emailed and the error body carries `details`: { challengeId, expiresAt, resendAvailableAt
            } for POST /v1/auth/email/register/{id}/verify'
        '429':
          description: AUTH_OTP_RATE_LIMITED (activation codes share the 5 per email per hour cap) or throttled
        '503':
          description: EMAIL_DELIVERY_FAILED (activation code could not be sent)
      summary: Login with email and password. Unverified email + right password returns 403 AUTH_EMAIL_NOT_VERIFIED
        with an activation challenge (rate limited)
      tags:
      - identity
  /v1/auth/email/verifications:
    post:
      operationId: requestEmailVerification
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationDto'
      responses:
        '200':
          description: Verification started
      summary: Email a verification token for an address added to an existing account (not used by sign-up)
      tags:
      - identity
  /v1/auth/email/verifications/{id}/confirm:
    post:
      operationId: confirmEmail
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmEmailDto'
      responses:
        '200':
          description: Confirmed
      tags:
      - identity
  /v1/auth/email/password-resets:
    post:
      operationId: requestPasswordReset
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestDto'
      responses:
        '202':
          description: ''
      summary: Request a password reset email (rate limited; same response for unknown emails)
      tags:
      - identity
  /v1/auth/email/password-resets/{id}/confirm:
    post:
      operationId: confirmPasswordReset
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmDto'
      responses:
        '200':
          description: ''
      summary: Set a new password with the emailed reset token; revokes customer sessions
      tags:
      - identity
  /v1/auth/passkeys/registration/options:
    post:
      operationId: registrationOptions
      parameters: []
      responses:
        '200':
          description: Options
      tags:
      - identity
  /v1/auth/passkeys/registration/verify:
    post:
      operationId: verifyRegistration
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationVerifyDto'
      responses:
        '200':
          description: Registered
      tags:
      - identity
  /v1/auth/passkeys/authentication/options:
    post:
      operationId: authenticationOptions
      parameters: []
      responses:
        '200':
          description: Options
      summary: Generate passkey authentication options (rate limited)
      tags:
      - identity
  /v1/auth/passkeys/signup/options:
    post:
      operationId: signupOptions
      responses:
        '200':
          description: Discoverable passkey registration options plus ceremonyId
      summary: Start contact-less passkey account registration
      tags: [identity]
  /v1/auth/passkeys/signup/verify:
    post:
      operationId: verifySignup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeySignupVerifyDto'
      responses:
        '200':
          description: CUSTOMER account created and session issued
      summary: Create a customer account from a verified passkey
      tags: [identity]
  /v1/auth/passkeys/authentication/verify:
    post:
      operationId: verifyAuthentication
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticationVerifyDto'
      responses:
        '200':
          description: Session issued
      summary: Verify passkey assertion and issue customer session (rate limited)
      tags:
      - identity
  /v1/auth/sessions/refresh:
    post:
      operationId: refresh
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshSessionDto'
      responses:
        '200':
          description: Rotated tokens
      tags:
      - identity
  /v1/auth/sessions/revoke:
    post:
      operationId: revoke
      parameters: []
      responses:
        '200':
          description: Revoked
      tags:
      - identity
  /v1/ops/sessions:
    post:
      operationId: login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpsLoginDto'
      responses:
        '200':
          description: Ops session
      summary: Ops email/password login
      tags:
      - identity
    delete:
      operationId: logout
      parameters:
      - name: authorization
        required: true
        in: header
        schema:
          type: string
      responses:
        '200':
          description: ''
      summary: Ops logout and revoke session/refresh token
      tags:
      - identity
  /v1/me:
    get:
      operationId: getMe
      parameters: []
      responses:
        '200':
          description: Profile
      security:
      - bearer: []
      summary: Current user profile and role grants
      tags:
      - identity
    patch:
      operationId: updateMe
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeDto'
      responses:
        '200':
          description: ''
      security:
      - bearer: []
      summary: Update profile fields. Email changes start EmailVerification (do not set verified email directly).
      tags:
      - identity
  /v1/me/avatar:
    post:
      operationId: uploadAvatar
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadAvatarDto'
      responses:
        '200':
          description: ''
      security:
      - bearer: []
      summary: Upload avatar (JPEG/PNG/WebP, base64 or data URL) to object storage; replaces and deletes the previous file
      description: 'Returns { avatarUrl } as a relative path `/v1/public/avatars/{userId}/{file}`; clients resolve it against
        the API base. 415 UPLOAD_TYPE_NOT_ALLOWED for other types; 413 UPLOAD_TOO_LARGE; 503 STORAGE_UNAVAILABLE.'
      tags:
      - identity
  /v1/public/avatars/{userId}/{file}:
    get:
      operationId: getPublicAvatar
      parameters:
      - name: userId
        required: true
        in: path
        schema:
          type: string
      - name: file
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: Image bytes of the user's current avatar (Cache-Control public, max-age=86400, immutable; nosniff).
        '404':
          description: Not the current avatar of that user (old or unknown files are never served).
      summary: Public avatar image
      tags:
      - identity
  /v1/me/addresses:
    get:
      operationId: listMyAddresses
      parameters: []
      responses:
        '200':
          description: '{ items: SavedAddress[] } default first, then newest.'
      security:
      - bearer: []
      summary: Customer address book (customer session)
      tags:
      - me
    post:
      operationId: createMyAddress
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSavedAddressDto'
      responses:
        '200':
          description: The saved address. The first address becomes default; isDefault=true moves the default.
        '400':
          description: Validation error (lat and lng must be sent together).
        '409':
          description: ADDRESS_LIMIT_REACHED (20 per user) or ADDRESS_KIND_TAKEN (one HOME, one WORK).
      security:
      - bearer: []
      summary: Save an address (customer session)
      tags:
      - me
  /v1/me/addresses/{id}:
    patch:
      operationId: updateMyAddress
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSavedAddressDto'
      responses:
        '200':
          description: The updated address.
        '404':
          description: ADDRESS_NOT_FOUND (missing or owned by another user).
        '409':
          description: ADDRESS_KIND_TAKEN.
      security:
      - bearer: []
      summary: Edit a saved address or make it default (customer session)
      tags:
      - me
    delete:
      operationId: deleteMyAddress
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: '{ deleted: true }. Deleting the default promotes the newest remaining address.'
        '404':
          description: ADDRESS_NOT_FOUND.
      security:
      - bearer: []
      summary: Delete a saved address (customer session)
      tags:
      - me
  /v1/me/notifications:
    get:
      operationId: listMyNotifications
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      - name: unreadOnly
        in: query
        required: false
        schema:
          type: boolean
      - name: category
        in: query
        required: false
        schema:
          type: string
          enum: [RIDE, FOOD, PROMOTION, SYSTEM]
      responses:
        '200':
          description: 'Newest first: { items: [{ id, category, title, body, data, read, readAt, createdAt }],
            total, unreadCount, page, limit }. Rows are written by the outbox relay alongside FCM pushes
            (status changes, campaigns); data carries aggregateType, aggregateId, status when known.'
      security:
      - bearer: []
      summary: Customer notification inbox (customer session)
      tags:
      - me
  /v1/me/notifications/read-all:
    post:
      operationId: markAllMyNotificationsRead
      parameters: []
      responses:
        '200':
          description: '{ updated } number of rows marked read.'
      security:
      - bearer: []
      summary: Mark every inbox notification read (customer session)
      tags:
      - me
  /v1/me/notifications/{id}/read:
    post:
      operationId: markMyNotificationRead
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The notification, now read. Idempotent.
        '404':
          description: NOTIFICATION_NOT_FOUND (missing or owned by another user).
      security:
      - bearer: []
      summary: Mark one inbox notification read (customer session)
      tags:
      - me
  /v1/me/presence/location:
    post:
      operationId: reportDriverLocation
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportLocationDto'
      responses:
        '200':
          description: '{ lat, lng, at }'
        '400':
          description: Invalid coordinates
        '403':
          description: Active DRIVER role required
      security:
      - bearer: []
      summary: Driver location heartbeat (DEC-PROD-031); updates lat/lng only, never online or service toggles
      tags:
      - identity
  /v1/me/presence:
    post:
      operationId: setPresence
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertPresenceDto'
      responses:
        '200':
          description: Presence upserted
        '403':
          description: Active DRIVER role required
      security:
      - bearer: []
      summary: Upsert driver presence (online/offline + optional lat/lng). Used by dispatch to filter offline drivers
        when a presence row exists.
      tags:
      - identity
    get:
      operationId: getPresence
      parameters: []
      responses:
        '200':
          description: Presence or null
      security:
      - bearer: []
      summary: Get current driver presence (online, lat/lng, rideEnabled, foodEnabled), if any
      tags:
      - identity
  /v1/me/role-grants:
    get:
      operationId: listMine
      parameters: []
      responses:
        '200':
          description: Grants
      security:
      - bearer: []
      summary: List my role grants
      tags:
      - identity
    post:
      operationId: requestRole
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestRoleGrantDto'
      responses:
        '200':
          description: Grant created/updated
      security:
      - bearer: []
      summary: Request a role grant
      tags:
      - identity
  /v1/ops/role-grants:
    get:
      operationId: list
      parameters:
      - name: status
        required: true
        in: query
        schema:
          type: string
      - name: page
        required: true
        in: query
        schema:
          type: string
      - name: limit
        required: true
        in: query
        schema:
          type: string
      responses:
        '200':
          description: ''
      security:
      - bearer: []
      summary: List role grants for staff review. Default ?status=PENDING; also ACTIVE|SUSPENDED.
      tags:
      - identity
  /v1/ops/role-grants/{id}/approve:
    post:
      operationId: approve
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: Approved
      security:
      - bearer: []
      summary: Approve a pending role grant
      tags:
      - identity
  /v1/ops/role-grants/{id}/reject:
    post:
      operationId: reject
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: Rejected
      security:
      - bearer: []
      summary: Reject a pending role grant
      tags:
      - identity
  /v1/ops/customers:
    get:
      operationId: list
      parameters: []
      responses:
        '200':
          description: ''
      security:
      - bearer: []
      summary: Ops paginated customers (users with CUSTOMER role grant)
      tags:
      - ops
