      responses:
        "201":
          description: "{ requestId, method, expiresAt, phoneMasked, graceDays, passkeyOptions } — PASSKEY: passkeyOptions are WebAuthn request options (single-use challenge bound to this user and request, allowCredentials = the user's own passkeys, userVerification required, 5 min); PHONE_OTP sends an SMS code; passkeyOptions is null otherwise"
        "409":
