          type: string
          enum: [ALL, RIDE, FOOD_ORDER]
          default: ALL
      - name: cursor
        in: query
        required: false
        description: Opaque nextCursor from the previous page.
        schema:
          type: string
          maxLength: 200
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      responses:
        '200':
          description: '{ items: DriverHistoryItem[], nextCursor | null }. Finished jobs still assigned
            to the caller (rides COMPLETED/CANCELLED, food DELIVERED/FAILED/CANCELLED), newest updatedAt
            first.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DriverHistoryItem'
                  nextCursor:
                    type: string
                    nullable: true
        '400':
          description: Validation, DRIVER_HISTORY_CURSOR_INVALID.
        '403':
          description: ROLE_NOT_ACTIVE (no active DRIVER grant).
      security:
      - bearer: []
      summary: Driver job history, rides + food deliveries (app session, active driver)
      tags:
      - driver
