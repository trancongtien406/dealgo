<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" fill="none">
  <defs>
    <!-- Background Night Gradients -->
    <linearGradient id="bg-sky" x1="600" y1="0" x2="600" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="45%" stop-color="#161b33" />
      <stop offset="75%" stop-color="#241b4d" />
      <stop offset="100%" stop-color="#090a10" />
    </linearGradient>

    <linearGradient id="han-river" x1="0" y1="320" x2="1200" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1b2a" />
      <stop offset="50%" stop-color="#1b263b" />
      <stop offset="100%" stop-color="#0a1128" />
    </linearGradient>

    <!-- Brand Gradients -->
    <linearGradient id="brand-purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>

    <linearGradient id="brand-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="brand-orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="50%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Dragon Bridge Gold Gradient -->
    <linearGradient id="dragon-gold" x1="400" y1="200" x2="900" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#facc15" />
      <stop offset="80%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Speed Streaks -->
    <linearGradient id="trail-purple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0" />
      <stop offset="70%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="trail-green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0" />
      <stop offset="70%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Glass Glow Filter -->
    <filter id="badge-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky Canvas with Rounded Corners -->
  <rect width="1200" height="480" rx="28" fill="url(#bg-sky)" />

  <!-- Stars & Constellations -->
  <g opacity="0.4">
    <circle cx="120" cy="65" r="1.5" fill="#ffffff" />
    <circle cx="280" cy="40" r="1.2" fill="#ffffff" />
    <circle cx="450" cy="85" r="1.8" fill="#ffffff" />
    <circle cx="620" cy="35" r="1.2" fill="#ffffff" />
    <circle cx="790" cy="70" r="2.0" fill="#ffffff" />
    <circle cx="950" cy="50" r="1.5" fill="#ffffff" />
    <circle cx="1100" cy="90" r="1.2" fill="#ffffff" />
    <circle cx="210" cy="110" r="1" fill="#c084fc" />
    <circle cx="710" cy="95" r="1" fill="#34d399" />
    <circle cx="880" cy="115" r="1" fill="#fb923c" />
  </g>

  <!-- Distant City Skyline (Da Nang Han Riverfront) -->
  <g opacity="0.35">
    <rect x="180" y="210" width="38" height="110" rx="3" fill="#1e293b" />
    <rect x="230" y="170" width="55" height="150" rx="4" fill="#334155" />
    <rect x="295" y="195" width="45" height="125" rx="3" fill="#1e293b" />
    <rect x="350" y="160" width="60" height="160" rx="4" fill="#334155" />
    <rect x="420" y="220" width="35" height="100" rx="2" fill="#1e293b" />
    <rect x="740" y="180" width="50" height="140" rx="3" fill="#1e293b" />
    <rect x="800" y="150" width="70" height="170" rx="4" fill="#334155" />
    <rect x="880" y="190" width="45" height="130" rx="3" fill="#1e293b" />
    <rect x="935" y="165" width="55" height="155" rx="4" fill="#334155" />
    <rect x="1000" y="210" width="40" height="110" rx="3" fill="#1e293b" />

    <!-- Illuminated Windows -->
    <g fill="#fef08a" opacity="0.6">
      <circle cx="245" cy="190" r="1.5" /><circle cx="260" cy="190" r="1.5" /><circle cx="245" cy="210" r="1.5" />
      <circle cx="365" cy="180" r="1.5" /><circle cx="385" cy="180" r="1.5" /><circle cx="365" cy="200" r="1.5" />
      <circle cx="820" cy="170" r="1.5" /><circle cx="840" cy="170" r="1.5" /><circle cx="820" cy="190" r="1.5" />
      <circle cx="950" cy="185" r="1.5" /><circle cx="970" cy="185" r="1.5" /><circle cx="950" cy="205" r="1.5" />
    </g>
  </g>

  <!-- Han River Surface & Reflections -->
  <path d="M0 320 Q300 300 600 320 T1200 315 L1200 480 L0 480 Z" fill="url(#han-river)" />
  <ellipse cx="600" cy="410" rx="500" ry="40" fill="#6d28d9" opacity="0.15" />
  <ellipse cx="400" cy="425" rx="300" ry="30" fill="#10b981" opacity="0.12" />

  <!-- Iconic Da Nang Dragon Bridge (Cầu Rồng) Arches -->
  <g>
    <!-- Main Span Deck -->
    <path d="M150 325 L1080 325" stroke="#1e293b" stroke-width="12" stroke-linecap="round" />
    
    <!-- Golden Dragon Spine Waves -->
    <path
      d="M300 322 C370 230 460 230 530 322 M540 322 C610 220 700 220 770 322 M780 322 C840 230 920 230 980 322"
      stroke="url(#dragon-gold)"
      stroke-width="14"
      fill="none"
      stroke-linecap="round"
    />
    <path
      d="M300 324 C370 240 460 240 530 324 M540 324 C610 230 700 230 770 324 M780 324 C840 240 920 240 980 324"
      stroke="#ffffff"
      stroke-width="3"
      stroke-opacity="0.8"
      fill="none"
      stroke-linecap="round"
    />

    <!-- Dragon Head Breathing Speed Fire Spark -->
    <path d="M980 318 Q1020 270 1050 288 Q1075 305 1060 325 L1025 322 Z" fill="#eab308" stroke="#fde047" stroke-width="3" />
    <circle cx="1038" cy="300" r="4" fill="#090a10" />
    <!-- Fire Spark Pulse -->
    <path d="M1065 295 Q1090 285 1115 292 Q1095 305 1065 300 Z" fill="url(#brand-orange)" opacity="0.9" />
  </g>

  <!-- Speed Motion Trails on Bridge Deck (Ride & Delivery Express) -->
  <path d="M100 338 L650 338" stroke="url(#trail-purple)" stroke-width="5" stroke-linecap="round" />
  <path d="M220 348 L800 348" stroke="url(#trail-green)" stroke-width="4.5" stroke-linecap="round" />
  <path d="M350 358 L950 358" stroke="url(#brand-orange)" stroke-width="3" stroke-linecap="round" opacity="0.85" />

  <!-- Motorbike Ride Silhouette with Speed Beam -->
  <g transform="translate(680, 310)">
    <!-- Motorbike Silhouette -->
    <circle cx="30" cy="35" r="14" stroke="#ffffff" stroke-width="3" fill="#090a10" />
    <circle cx="95" cy="35" r="14" stroke="#ffffff" stroke-width="3" fill="#090a10" />
    <path d="M30 35 L55 20 L75 20 L95 35 M55 20 L68 35 M48 10 L65 10" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Rider -->
    <circle cx="58" cy="2" r="8" fill="#34d399" />
    <path d="M54 10 L68 22 L55 30" stroke="#34d399" stroke-width="4" stroke-linecap="round" />
    <!-- Delivery Backpack / Deal Bag -->
    <rect x="40" y="8" width="14" height="16" rx="3" fill="#6d28d9" stroke="#c084fc" stroke-width="1.5" />
    <!-- Headlight Beam -->
    <path d="M105 32 L160 25 L160 45 L105 38 Z" fill="#fef08a" opacity="0.35" />
  </g>

  <!-- Hero Content Left: Typography & Value Proposition -->
  <g transform="translate(70, 75)">
    <!-- DealGo Badge -->
    <g>
      <rect width="185" height="32" rx="16" fill="rgba(109, 40, 217, 0.25)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1" />
      <circle cx="16" cy="16" r="6" fill="#10b981" />
      <text x="32" y="21" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-weight="700" font-size="12" fill="#e9d5ff" letter-spacing="0.5">
        DEAL DỄ — ĐI NHANH
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="85" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="-1">
      Nền Tảng <tspan fill="#a78bfa">Ride</tspan> &amp; <tspan fill="#34d399">Food</tspan>
    </text>
    <text x="0" y="132" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="-1">
      Tự Do <tspan fill="#fb923c">Thương Lượng Giá</tspan>
    </text>

    <!-- Subtitle description -->
    <text x="0" y="172" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-weight="500" font-size="16" fill="#94a3b8">
      Đặt xe máy 2 bánh tốc độ &amp; Thưởng thức ẩm thực Đà Nẵng với giá chốt minh bạch.
    </text>

    <!-- Feature Tags / Chips -->
    <g transform="translate(0, 195)">
      <!-- Chip 1: Trả giá Ride -->
      <g>
        <rect width="145" height="36" rx="10" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(167, 139, 250, 0.4)" stroke-width="1" />
        <text x="16" y="23" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#e2e8f0">
          ⚡ Trả giá trực tiếp
        </text>
      </g>

      <!-- Chip 2: Giao đồ ăn -->
      <g transform="translate(155, 0)">
        <rect width="140" height="36" rx="10" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(52, 211, 153, 0.4)" stroke-width="1" />
        <text x="16" y="23" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#e2e8f0">
          🍲 Giao món nóng hổi
        </text>
      </g>

      <!-- Chip 3: Đối soát chuẩn -->
      <g transform="translate(305, 0)">
        <rect width="145" height="36" rx="10" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(251, 146, 60, 0.4)" stroke-width="1" />
        <text x="16" y="23" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#e2e8f0">
          🛡️ Đối soát an tâm
        </text>
      </g>
    </g>
  </g>

  <!-- DealGo Central Emblem Glow Badge (Right side highlight) -->
  <g transform="translate(1010, 110)" filter="url(#badge-glow)">
    <!-- Glassmorphic Card -->
    <rect width="120" height="120" rx="30" fill="rgba(30, 27, 75, 0.65)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2" />
    
    <!-- Outer Intertwined Arc -->
    <path
      d="M40 60C40 46.7 50.7 36 64 36C72.8 36 80.5 40.7 84.6 47.8C85.9 50 84.8 52.8 82.4 53.6C80 54.4 77.4 52.7 76.3 50.4C73.6 45 68 41.4 61.6 41.4C51.3 41.4 43 49.7 43 60C43 64.6 44.7 68.8 47.5 72.1C49.3 74.2 48.4 77.4 45.8 78.5C43.2 79.6 40.2 78 38.6 75.6C36.3 71 35 65.7 35 60H40Z"
      fill="url(#brand-purple)"
    />
    <path
      d="M80 60C80 73.3 69.3 84 56 84C47.2 84 39.5 79.3 35.4 72.2C34.1 70 35.2 67.2 37.6 66.4C40 65.6 42.6 67.3 43.7 69.6C46.4 75 52 78.6 58.4 78.6C68.7 78.6 77 70.3 77 60C77 55.4 75.3 51.2 72.5 47.9C70.7 45.8 71.6 42.6 74.2 41.5C76.8 40.4 79.8 42 81.4 44.4C83.7 49 85 54.3 85 60H80Z"
      fill="url(#brand-green)"
    />

    <!-- Handshake D core -->
    <path d="M52 48H62C68 48 73 53 73 60C73 67 68 72 62 72H52V48ZM57 54V66H61.5C64.5 66 67 63.3 67 60C67 56.7 64.5 54 61.5 54H57Z" fill="#ffffff" />
    <circle cx="70" cy="48" r="4" fill="url(#brand-orange)" />
  </g>
</svg>
