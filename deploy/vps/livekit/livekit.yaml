# LiveKit on the shared VPS (behind the existing vms Caddy, which owns :80/:443).
# Signalling: wss://livekit-dealgo.trancongtien.com -> vms Caddy -> 172.19.0.1:7880 (vms_edge gateway).
# Media: UDP 50000-60000 and ICE/TCP 7881 straight to the public IP.
# TURN: UDP 3478 and TURN/TLS on TCP 5349 (not 443, which belongs to the shared Caddy). The TLS
# certificate is issued by that Caddy for turn-dealgo and copied to livekit/tls by sync-turn-cert.sh.
port: 7880
bind_addresses:
  - 127.0.0.1
  - 172.19.0.1
logging:
  level: info
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: false
  node_ip: 103.116.38.245
  enable_loopback_candidate: false
turn:
  enabled: true
  domain: turn-dealgo.trancongtien.com
  udp_port: 3478
  tls_port: 5349
  cert_file: /etc/livekit-tls/turn.crt
  key_file: /etc/livekit-tls/turn.key
key_file: /etc/livekit-keys.yaml
room:
  empty_timeout: 120
  departure_timeout: 20
