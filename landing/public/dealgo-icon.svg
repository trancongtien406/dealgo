<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="dealgo-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#2e1065" />
      <stop offset="100%" stop-color="#090a0f" />
    </linearGradient>

    <!-- Deal Swoosh Gradient (Purple/Indigo - Negotiation & Deal) -->
    <linearGradient id="deal-grad" x1="8" y1="8" x2="36" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="60%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>

    <!-- Go Swoosh Gradient (Emerald/Mint - Speed & 2-Wheel Movement) -->
    <linearGradient id="go-grad" x1="40" y1="40" x2="12" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Accent Food Glow -->
    <linearGradient id="food-dot" x1="22" y1="20" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow-shadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#8b5cf6" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect width="48" height="48" rx="13" fill="url(#dealgo-bg)" />
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="12.25" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" />

  <!-- Outer Wheel & Intertwined Handshake Dynamic Symbol -->
  <g filter="url(#glow-shadow)">
    <!-- Arc 1: Deal Wave (Upper & Left Arc - Handshake grip curve) -->
    <path
      d="M14 24C14 17.3726 19.3726 12 26 12C30.4183 12 34.2568 14.3824 36.3137 17.9282C36.9538 19.0315 36.4259 20.4477 35.2018 20.8407C33.9776 21.2338 32.7092 20.3951 32.148 19.2435C30.8256 16.5298 28.0267 14.7 24.8 14.7C19.6638 14.7 15.5 18.8638 15.5 24C15.5 26.3142 16.3458 28.4312 17.7533 30.063C18.6657 31.121 18.2323 32.7303 16.9248 33.2801C15.6173 33.8299 14.1206 32.9972 13.3159 31.8152C12.1856 29.5398 11.5 26.8524 11.5 24H14Z"
      fill="url(#deal-grad)"
    />

    <!-- Arc 2: Go Wave (Lower & Right Arc - Motorbike wheel speed & hand clasp) -->
    <path
      d="M34 24C34 30.6274 28.6274 36 22 36C17.5817 36 13.7432 33.6176 11.6863 30.0718C11.0462 28.9685 11.5741 27.5523 12.7982 27.1593C14.0224 26.7662 15.2908 27.6049 15.852 28.7565C17.1744 31.4702 19.9733 33.3 23.2 33.3C28.3362 33.3 32.5 29.1362 32.5 24C32.5 21.6858 31.6542 19.5688 30.2467 17.937C29.3343 16.879 29.7677 15.2697 31.0752 14.7199C32.3827 14.1701 33.8794 15.0028 34.6841 16.1848C35.8144 18.4602 36.5 21.1476 36.5 24H34Z"
      fill="url(#go-grad)"
    />

    <!-- Interlocking Handshake Hub (The Deal & Go Meeting Point / Stylized D) -->
    <path
      d="M20 18.5H25C28.0376 18.5 30.5 20.9624 30.5 24C30.5 27.0376 28.0376 29.5 25 29.5H20V18.5ZM23 21.5V26.5H24.8C26.2912 26.5 27.5 25.38 27.5 24C27.5 22.62 26.2912 21.5 24.8 21.5H23Z"
      fill="#ffffff"
    />

    <!-- Speed & Food Energy Accent (Spark of connection) -->
    <circle cx="29" cy="18" r="2.5" fill="url(#food-dot)" />
  </g>
</svg>
