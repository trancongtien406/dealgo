<svg width="260" height="340" viewBox="0 0 260 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bodyCyberDropoff" x1="40" y1="40" x2="220" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4C0519"/>
      <stop offset="50%" stop-color="#2E1065"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="neonCoralGrad" x1="60" y1="40" x2="200" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="50%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <radialGradient id="targetGlowDrop" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#F43F5E" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0"/>
    </radialGradient>
    <filter id="cyberGlowDrop" x="0" y="0" width="260" height="340" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#F43F5E" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Ground Target Rings (Vạch Đích Target Mặt Đường) -->
  <g opacity="0.95">
    <!-- Outer checkered ring -->
    <ellipse cx="130" cy="305" rx="90" ry="24" stroke="#F43F5E" stroke-width="1.5" stroke-dasharray="10 6" opacity="0.4"/>
    <!-- Middle target ring -->
    <ellipse cx="130" cy="305" rx="60" ry="16" fill="url(#targetGlowDrop)" stroke="#FB7185" stroke-width="2" opacity="0.7"/>
    <!-- Center contact core -->
    <ellipse cx="130" cy="305" rx="20" ry="6" fill="#F43F5E"/>
    <ellipse cx="130" cy="305" rx="8" ry="2.5" fill="#FFFFFF"/>
  </g>

  <!-- Laser Pinpoint Beam -->
  <polygon points="126,240 134,240 131,305 129,305" fill="#FB7185" opacity="0.75"/>
  <line x1="130" y1="240" x2="130" y2="305" stroke="#FFFFFF" stroke-width="1.5" opacity="0.9"/>

  <!-- Main Floating Dynamic D-Pod -->
  <g filter="url(#cyberGlowDrop)">
    <rect x="52" y="32" width="156" height="200" rx="44" fill="#090D1A" stroke="url(#neonCoralGrad)" stroke-width="3.5"/>
    <rect x="58" y="38" width="144" height="188" rx="38" fill="url(#bodyCyberDropoff)" fill-opacity="0.9"/>
    
    <path d="M72 44H96M164 44H188" stroke="#FB7185" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Status Pill -->
    <rect x="74" y="56" width="112" height="26" rx="13" fill="#F43F5E" fill-opacity="0.2" stroke="#FB7185" stroke-width="1.5"/>
    <circle cx="90" cy="69" r="4" fill="#FB7185"/>
    <circle cx="90" cy="69" r="2" fill="#FFFFFF"/>
    <text x="132" y="74" text-anchor="middle" fill="#FFE4E6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="1.5">ĐIỂM ĐẾN</text>

    <!-- Center Finish Portal Core -->
    <g transform="translate(130, 144)">
      <!-- Outer Hex/Circle -->
      <circle cx="0" cy="0" r="42" fill="#F43F5E" fill-opacity="0.1" stroke="#FB7185" stroke-width="2" stroke-dasharray="6 4"/>
      <!-- Middle ring -->
      <circle cx="0" cy="0" r="28" fill="#F43F5E" fill-opacity="0.2" stroke="#FB7185" stroke-width="1.5"/>
      <!-- Speed Finish Wings / Flag Motif -->
      <path d="M-18 -12L0 -24L18 -12L12 16L0 24L-12 16Z" fill="url(#neonCoralGrad)"/>
      <path d="M-8 -6L0 -14L8 -6L5 8L0 12L-5 8Z" fill="#FFFFFF"/>
    </g>

    <path d="M124 232L130 244L136 232H124Z" fill="#FB7185"/>
  </g>
</svg>

